<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Hapsetme Sorgu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --red: #dc2626; --red-glow: rgba(220,38,38,0.4);
      --bg: #0a0a0a; --text: #f1f1f1; --muted: #4a4a5a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    /* Grid arka plan */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(220,38,38,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(220,38,38,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
    }
    .wrapper {
      position: relative; z-index: 1;
      text-align: center; padding: 40px 24px;
      animation: fadeInUp 0.8s ease both;
    }
    .error-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(5rem, 18vw, 12rem);
      font-weight: 900; color: var(--red);
      text-shadow: 0 0 60px var(--red-glow);
      line-height: 1; letter-spacing: -0.04em;
    }
    .glitch {
      position: relative;
    }
    .glitch::before,
    .glitch::after {
      content: '404';
      position: absolute; inset: 0;
      opacity: 0.7;
    }
    .glitch::before {
      color: #00ffff; clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
      animation: glitch-a 3s infinite;
    }
    .glitch::after {
      color: var(--red); clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
      animation: glitch-b 3s infinite;
    }
    .subtitle {
      font-size: 1.2rem; font-weight: 700; margin: 16px 0 10px;
    }
    .desc {
      color: var(--muted); margin-bottom: 32px; font-size: 0.9rem; line-height: 1.7;
    }
    .btn-home {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 13px 28px; border-radius: 10px;
      background: var(--red); color: #fff; font-weight: 600;
      text-decoration: none; font-size: 0.9rem;
      box-shadow: 0 4px 20px var(--red-glow);
      transition: all 0.25s;
    }
    .btn-home:hover {
      background: #ef4444;
      box-shadow: 0 4px 32px var(--red-glow);
      transform: translateY(-2px);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes glitch-a {
      0%,95%,100% { transform: translateX(0); }
      96% { transform: translateX(-4px); }
      98% { transform: translateX(4px); }
    }
    @keyframes glitch-b {
      0%,90%,100% { transform: translateX(0); }
      91% { transform: translateX(4px); }
      93% { transform: translateX(-4px); }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="error-code glitch">404</div>
    <h1 class="subtitle">Sayfa Bulunamadı</h1>
    <p class="desc">Aradığınız sayfa mevcut değil veya taşınmış olabilir.</p>
    <a href="index.html" class="btn-home">
      <i class="fa-solid fa-house"></i>
      Ana Sayfaya Dön
    </a>
  </div>
</body>
</html>
